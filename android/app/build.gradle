apply plugin: 'com.android.application'

android {
    namespace = "space.vaultapp.messenger"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "space.vaultapp.messenger"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 42
        versionName "1.41"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Secrets read from the shell environment, never hardcoded here —
    // mirrors ecosystem.config.cjs's "secrets live in the shell, not the
    // repo" pattern. The keystore itself lives at repo root
    // (android_release.keystore), gitignored, same custody model as
    // vps_key.pem. See android_release.keystore.CREDENTIALS.txt (also
    // gitignored, delete once backed up) for the actual values.
    //
    // PKCS12 keystores (what keytool -storetype PKCS12 produces) don't
    // support a store password different from the key password — both env
    // vars below are expected to hold the same value.
    signingConfigs {
        release {
            storeFile file(System.getenv("VAULT_ANDROID_KEYSTORE_PATH") ?: "../../android_release.keystore")
            storePassword System.getenv("VAULT_ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("VAULT_ANDROID_KEY_ALIAS") ?: "vault-release"
            keyPassword System.getenv("VAULT_ANDROID_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            // R8 on. Capacitor is reflection-heavy (plugins are resolved by
            // class name from assets/capacitor.plugins.json, and by the
            // @CapacitorPlugin annotation), which is normally the reason a
            // Capacitor app is left unminified — but @capacitor/android ships
            // consumerProguardFiles with the necessary -keep rules, so those
            // are applied to this module automatically. proguard-rules.pro
            // adds the same protection for this app's own plugins
            // (ExternalOpener, ScreenSecurity, AudioRoute).
            //
            // shrinkResources is deliberately left off: the web app's assets
            // live in assets/, not res/, so resource shrinking would buy
            // almost nothing here while adding a class of failure that only
            // shows up at runtime.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // WebViewFeature/WebSettingsCompat (MainActivity's WebAuthn opt-in) —
    // capacitor-android already pulls this in transitively, but Gradle's
    // `implementation` isn't exposed to consumers, so it needs its own
    // explicit line here to be on this module's own compile classpath.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
