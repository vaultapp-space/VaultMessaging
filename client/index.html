<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Vault — End-to-end encrypted anonymous messaging. Zero PII, zero persistence, 24-hour auto-delete. Privacy without compromise." />
    <meta name="theme-color" content="#fafafa" />
    <meta name="color-scheme" content="light" />

    <title>Vault — Secure Anonymous Messaging</title>

    <!-- Declares vaultapp.space (not www.vaultapp.space, which nginx now
         redirects here — see deploy/nginx/vaultapp.space.conf) as the one
         URL search engines should index, so ranking signals for the two
         previously-identical origins consolidate onto a single page
         instead of splitting. -->
    <link rel="canonical" href="https://vaultapp.space/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vaultapp.space/" />
    <meta property="og:title" content="Vault — Secure Anonymous Messaging" />
    <meta property="og:description" content="Vault combines double-ratcheted E2EE messaging with confidential voice/video calls. Zero PII, zero persistence, 24-hour auto-delete." />
    <meta property="og:image" content="https://vaultapp.space/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vaultapp.space/" />
    <meta property="twitter:title" content="Vault — Secure Anonymous Messaging" />
    <meta property="twitter:description" content="Vault combines double-ratcheted E2EE messaging with confidential voice/video calls. Zero PII, zero persistence, 24-hour auto-delete." />
    <meta property="twitter:image" content="https://vaultapp.space/og-image.png" />

    <!-- Structured data: makes Vault eligible for richer search-result
         treatment (an app card rather than a bare blue link). Price 0 is
         literal, not a placeholder — there is no paid tier. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Vault",
        "url": "https://vaultapp.space/",
        "description": "End-to-end encrypted anonymous messaging. Zero PII, zero persistence, 24-hour auto-delete.",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Android, Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Fonts are bundled, not fetched from fonts.googleapis.com. Three
         reasons, in order of how much they matter:
         1. Privacy. This file ships inside the Android APK, so a remote font
            link meant every cold start of a "zero PII" messenger sent the
            user's IP and a launch timestamp to Google before they'd even
            logged in — a usage-pattern oracle on an app whose entire premise
            is not having one.
         2. F-Droid. Its inclusion policy treats a non-free network
            dependency loaded at runtime as a blocker.
         3. It actually renders. The remote <link> was render-blocking, so a
            slow or offline start (the normal case for a freshly installed
            app on mobile data) got no webfont at all and fell back to the
            system stack — Courier for every --font-mono run on Android,
            which is the exact failure the link was there to prevent.
         Generated by scripts/fetch-fonts.mjs — latin + latin-ext only,
         4 variable woff2 files, ~172 KiB total. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* Critical inline CSS for instant FCP */
      body { margin: 0; background: #fafafa; color: #09090b; }
      #app { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
