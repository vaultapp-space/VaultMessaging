# nginx site config for vaultapp.space, mirrored from the production VPS
# (/etc/nginx/sites-available/vault) for reproducibility — the same reason
# ecosystem.config.cjs is tracked in the repo instead of living only on the
# box. Kept in sync manually; the ssl_certificate/ssl_certificate_key/include
# lines are managed by Certbot and will not match a fresh box until it has
# been issued a certificate.
server {
    server_name vaultapp.space www.vaultapp.space;

    # Aggressive Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # Security & HTTPS Headers (HSTS + Frame protection)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # OCSP Stapling for performance (removes client-side CA check latency)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    location / {
        root /home/ubuntu/VaultMessaging/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Far-Future Caching for Hashed static assets
    location /assets/ {
        root /home/ubuntu/VaultMessaging/client/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /api {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Android content OTA (client/src/lib/capacitor/updater.js polls this on
    # launch; deploy/scripts/publish-ota.sh writes it). Static files, not a
    # Fastify route — these are public artifacts, not per-user-authorized
    # like media.routes.js's story/sticker images, so publishing a new
    # bundle is a plain file-drop with no pm2 restart, decoupled from the
    # app server's own uptime. /ota/ itself must never cache (the manifest
    # is the whole point of checking freshly); /ota/bundles/ can cache hard
    # because each filename is a specific immutable version, same reasoning
    # as /assets/ above.
    location /ota/bundles/ {
        root /home/ubuntu/VaultMessaging;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    # Signed APKs to sideload — a native-shell update the content-OTA path
    # above can't cover (new plugin, new permission, SDK bump). Immutable
    # cache, same reasoning as /ota/bundles/: each filename is one specific
    # signed build. Deliberately still under /ota/ rather than /android/ —
    # the latter would collide with the repo's own top-level android/
    # source directory on disk (root points at the repo root), silently
    # mixing a runtime artifact into tracked source.
    location /ota/apks/ {
        root /home/ubuntu/VaultMessaging;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /ota/ {
        root /home/ubuntu/VaultMessaging;
        add_header Cache-Control "no-store" always;
        # @capgo/capacitor-updater's native Android code POSTs a JSON body
        # to updateUrl (confirmed against its actual source — see
        # updater.js's comment) rather than GET-ing it; nginx's static-file
        # serving only allows GET/HEAD by default and 405s anything else.
        # The standard nginx workaround: catch the 405 internally and
        # re-serve the same URI as if it were a plain 200 — the POST body
        # itself is irrelevant here since this location only ever serves a
        # static, precomputed manifest, never reads the request.
        error_page 405 =200 $uri;
    }

    # Unauthenticated by design — it's what an uptime monitor hits. The
    # response carries no secrets, only reaper counters (see PROGRESS.md).
    location /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vaultapp.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vaultapp.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.vaultapp.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = vaultapp.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name vaultapp.space www.vaultapp.space;
    return 404; # managed by Certbot
}
