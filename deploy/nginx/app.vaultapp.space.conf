# nginx site config for app.vaultapp.space, mirrored from the production VPS
# (/etc/nginx/sites-available/app.vaultapp.space) for reproducibility — same
# reason as vaultapp.space.conf. The 443/cert lines are managed by Certbot.
#
# This hostname is NOT the site: it's the Capacitor Android app's configured
# WebView origin (see client/capacitor.config.ts's `server.hostname` comment
# for why a subdomain, not the real domain, had to be used there). Nothing
# the app does ever actually reaches this host over the real network —
# Capacitor's WebViewLocalServer claims every request to its own configured
# hostname for locally-bundled assets before it would ever hit the network.
#
# The one exception is Digital Asset Links verification: Android's
# Credential Manager (see android/app/src/main/java/.../MainActivity.java's
# WebAuthn opt-in) independently fetches this domain's
# /.well-known/assetlinks.json from Google's own infrastructure — not from
# inside the app's WebView — to confirm this Android app is allowed to use
# platform biometrics for the origin the WebView presents pages from. That
# fetch is the only reason this hostname needs to resolve in real DNS and be
# served at all.
server {
    server_name app.vaultapp.space;

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '[{"relation":["delegate_permission/common.handle_all_urls","delegate_permission/common.get_login_creds"],"target":{"namespace":"android_app","package_name":"space.vaultapp.messenger","sha256_cert_fingerprints":["0A:3F:8F:0F:54:C0:56:69:BE:C0:28:40:3A:2D:55:A8:16:A1:5C:B7:60:37:1B:11:B2:40:A4:A2:E3:96:C4:40"]}}]';
    }

    # Nothing legitimate ever requests anything else at this origin from
    # outside the app — it's a label, not a real site.
    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.vaultapp.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.vaultapp.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.vaultapp.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name app.vaultapp.space;
    return 404; # managed by Certbot
}
