Name: Vault
Summary: Privacy-first end-to-end encrypted messenger
Description: |-
  Vault is a privacy-first, end-to-end encrypted messenger. One-to-one
  chats are end-to-end encrypted using the Double Ratchet and X3DH
  (implemented with WebCrypto), the same design Signal uses. No phone
  number or email is required to create an account, and messages
  auto-delete after 24 hours.

  This Android app is a Capacitor wrapper around the same open-source web
  client that runs on vaultapp.space — the JavaScript is bundled into the
  APK at build time, not loaded from a remote URL, so the same source this
  build recipe checks out is what actually runs on the device. Native
  additions on top of the shared web client: a welcome screen, safe-area
  aware layout, and Android status bar theming.

  Vault talks to a specific hosted backend (vaultapp.space) by default; it
  is not a server-agnostic client. The backend's source lives in the same
  repository, under server/.

