# Metadata for a pre-built/binary app in this self-hosted F-Droid repo. No
# `Builds:` section is defined on purpose — fdroidserver docs are explicit
# that build-from-source instructions are only needed when *this* repo is
# meant to build the APK itself (`fdroid build`). This repo never does that:
# the APK is built and signed locally (android_release.keystore) and just
# copied into repo/ (see android/README.md), and `fdroid update` reads its
# version info directly from the APK.
