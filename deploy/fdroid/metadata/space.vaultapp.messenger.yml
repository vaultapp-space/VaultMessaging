Name: Vault
Summary: Privacy-first end-to-end encrypted messenger
Description: >-
  Vault is a privacy-first, end-to-end encrypted messenger. Messages use
  the Double Ratchet and X3DH (via WebCrypto) — the same client code that
  runs on vaultapp.space, wrapped as a native Android app. No phone number
  or email is required to sign up, and messages auto-delete after 24 hours.
  .
  This APK is built and signed directly by the Vault developer and
  published only through this self-hosted repository. It is not built
  from source or distributed by f-droid.org.

