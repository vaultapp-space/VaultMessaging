# XcodeGen spec. The .xcodeproj is generated from this rather than committed:
# a pbxproj is a merge-conflict machine and nobody can review a diff of one.
#
#   cd ios && xcodegen generate && open VaultMessenger.xcodeproj
name: VaultMessenger
options:
  bundleIdPrefix: space.vaultapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  VaultMessenger:
    type: application
    platform: iOS
    sources:
      - path: VaultMessenger/Sources
      - path: VaultMessenger/Resources
    info:
      path: VaultMessenger/Info.plist
      properties:
        CFBundleDisplayName: Vault
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The dev server uses a self-signed certificate. Localhost only, and
        # never a blanket NSAllowsArbitraryLoads — production talks to
        # vaultapp.space over ordinary TLS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.vaultapp.messenger
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  VaultMessengerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VaultMessengerUITests
    dependencies:
      - target: VaultMessenger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.vaultapp.messenger.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VaultMessenger:
    build:
      targets:
        VaultMessenger: all
        VaultMessengerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VaultMessengerUITests
      # Credentials are not stored here — these expand build settings, so the
      # values come from the command line:
      #   xcodebuild test VAULT_TEST_USERNAME=… VAULT_TEST_PASSWORD=…
      # An account in the repository would be an account someone reuses.
      environmentVariables:
        VAULT_TEST_USERNAME: $(VAULT_TEST_USERNAME)
        VAULT_TEST_PASSWORD: $(VAULT_TEST_PASSWORD)
